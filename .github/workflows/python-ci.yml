name: Python CI

# Tests and packaging checks for the Python interoperability package only.
# Deliberately scoped to python/** so it stays independent of the TypeScript
# CI that will cover the rest of the repository, and separate from publishing.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PACKAGE_DIR: python/openagentfence

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: python -m unittest discover -s tests -v

  package:
    name: Packaging check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "build==1.5.0" "twine==7.0.0"

      - name: Build distributions
        working-directory: ${{ env.PACKAGE_DIR }}
        run: python -m build

      - name: Validate distribution metadata
        working-directory: ${{ env.PACKAGE_DIR }}
        run: python -m twine check --strict dist/*

      - name: Verify the wheel installs and runs
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/verify/bin/python -c "import openagentfence; print(openagentfence.__version__)"
          /tmp/verify/bin/python -m openagentfence --version
