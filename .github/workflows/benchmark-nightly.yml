name: Nightly reproducible benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  benchmark:
    name: Offline benchmark and control-performance run (nightly profile)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm benchmark:pr
        env:
          OAF_BENCHMARK_PROFILE: nightly
          OAF_BENCHMARK_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/benchmarks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-benchmark-nightly
          path: artifacts/benchmarks
          if-no-files-found: error
